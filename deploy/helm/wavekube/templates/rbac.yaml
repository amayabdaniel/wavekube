apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wavekube-controller
rules:
  - apiGroups: ["ran.wavekube.io"]
    resources: ["gnodebs", "ranpipelines", "ransecuritypolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["ran.wavekube.io"]
    resources: ["gnodebs/status", "ranpipelines/status", "ransecuritypolicies/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["ran.wavekube.io"]
    resources: ["gnodebs/finalizers"]
    verbs: ["update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Least privilege: the controllers only Create / CreateOrUpdate services and
  # configmaps (no code path deletes them), so no "delete". "pods" was granted
  # cluster-wide full CRUD but is never used — the PodTemplateSpecs live inside
  # the Deployments/Jobs, whose own controllers create the pods; the operator
  # needs no direct pods access. "events" was granted but no EventRecorder is
  # wired. Both removed.
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Required for controller-runtime leader election (--leader-elect).
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: wavekube-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: wavekube-controller
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
